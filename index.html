function dayIndex(date) {
  return (new Date(date+"T12:00:00Z").getUTCDay()+6)%7;
}

function vocabularyMinutes() {
  return 40;
}

function initialTasks(end=defaultExam,version=4) {
  const result=[];
  for(let date=firstDay;date<=end;date=shiftDate(date,1)) {
    const period=Math.floor((Date.parse(date)-Date.parse(firstDay))/604800000);
    const phase=trainingPhases[Math.min(period,trainingPhases.length-1)];
    const weekday=dayIndex(date);
    const reductions=weekday<5 ? [10,10,5] : [5,5,5,5,0];
    weekdays[weekday].forEach(([subject,baseMinutes,title],index)=>{
      const minutes=version<4?baseMinutes:baseMinutes-reductions[index];
      const phaseNote=subject==="数学" ? phase.math : subject==="英语" ? phase.english : "校内同技能任务可以计入这一段。";
      const detail=studySteps[weekday][index]+" "+phaseNote;
      result.push({id:`daily-${date}-${index}`,date,subject,title,minutes,detail});
    });
  }
  return result;
}

function planUpgrade(existing,examDate) {
  const old=new Map(legacyTasks().map(task=>[task.id,task]));
  for (const task of legacyAddedTasks()) old.set("supplement-"+task.date,task);
  const remove=existing.filter(task=>{
    const entry=old.get(task.id);
    return task.status==="planned" && entry && ["date","subject","title","detail","minutes"].every(key=>entry[key]===task[key]);
  }).map(task=>task.id);
  const removed=new Set(remove);
  const reserved=new Map();
  for (const task of existing) {
    if(!removed.has(task.id)) reserved.set(task.date,(reserved.get(task.date)??0)+task.minutes);
  }
  const insert=[];
  const end=examDate<defaultExam?examDate:defaultExam;
  for(const task of initialTasks(end)) {
    const target=dayIndex(task.date)<5?120:300;
    const remaining=target-vocabularyMinutes()-(reserved.get(task.date)??0);
    if(remaining<=0) continue;
    const minutes=Math.min(remaining,task.minutes);
    insert.push({...task,minutes});
    reserved.set(task.date,(reserved.get(task.date)??0)+minutes);
  }
  return {remove,insert};
}

function vocabularyTimeUpgrade(existing) {
  const previous=new Map(initialTasks(defaultExam,3).map(task=>[task.id,task]));
  const next=new Map(initialTasks().map(task=>[task.id,task.minutes]));
  return existing.filter(task=>{
    const old=previous.get(task.id);
    return task.status==="planned" && old && next.get(task.id)!==task.minutes
      && ["date","subject","title","detail","minutes"].every(key=>old[key]===task[key]);
  }).map(task=>({...previous.get(task.id),nextMinutes:next.get(task.id)}));
}

function legacyAddedTasks() {
  return legacyTasks().filter(task => {

    return weekday === 2 || weekday === 5 || task.date === "2026-12-13" || task.date === "2026-12-31";

function parseUnfamiliarWords(raw) {
  if(typeof raw!=="string" || raw.length>8000) return null;
  const items=raw.split(/[\n,，;；、]+/).map(value=>value.trim()).filter(Boolean);
  if(!items.length || items.length>60 || items.some(value=>value.length>100 || !/[A-Za-z]/.test(value))) return null;
  const unique=new Map();
  for(const value of items) {
    const word=value.normalize("NFKC").replace(/\s+/g," ");
    if(word.length>100) return null;
    const key=word.toLowerCase().replace(/[’‘]/g,"'");
    if(key.length>100) return null;
    if(!unique.has(key)) unique.set(key,{key,word});
  }
  return [...unique.values()];
}

const requestValue = request => new Promise((resolve,reject)=>{
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
});
const transactionDone = tx => new Promise((resolve,reject)=>{
  tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error ?? new Error("修改未保存。"));tx.onerror=()=>reject(tx.error);
});
let role="student";
let opening;
function database() {
  if (!opening) {
    opening=new Promise((resolve,reject)=>{
      let req;
      try { req=indexedDB.open("luhe-sprint-local-2026",1); }
      catch { reject(new Error("此浏览器无法保存本机记录，请用 Chrome 或 Edge 打开 HTML 文件。"));return; }
      req.onupgradeneeded=()=>{
        req.result.createObjectStore("state");
        req.result.createObjectStore("evidence");
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(new Error("此浏览器无法保存本机记录，请用 Chrome 或 Edge 打开 HTML 文件。"));
    });
  }
  return opening;
}
function defaultState() {
  return {
    examDate:defaultExam,monthlyDate:null,examConfirmed:false,planVersion:4,
    tasks:initialTasks().map(task=>({...task,status:"planned"})),
    attachments:[],logs:[],mistakes:[],reviews:[],vocabulary:[],words:[],
  };
}
async function withState(update) {
  const db=await database();
  const tx=db.transaction(["state","evidence"],update ? "readwrite":"readonly");
  const done=transactionDone(tx);
  const storage=tx.objectStore("state");
  try {
    const state=await requestValue(storage.get("family")) ?? defaultState();
    state.vocabulary ??= [];
    state.words ??= [];
    if((state.planVersion??1)<3) {
      const {remove,insert}=planUpgrade(state.tasks,state.examDate);
      const removed=new Set(remove);
      state.tasks=state.tasks.filter(task=>!removed.has(task.id)).concat(insert.map(task=>({...task,status:"planned"})));
      state.planVersion=4;
    } else if(state.planVersion===3) {
      const changes=new Map(vocabularyTimeUpgrade(state.tasks).map(task=>[task.id,task.nextMinutes]));
      for(const task of state.tasks) {
        if(changes.has(task.id)) task.minutes=changes.get(task.id);
      }
      state.planVersion=4;
    }
    if(update) {
      update(state,tx.objectStore("evidence"));
      storage.put(state,"family");
    }
    await done;
    return state;
  } catch(error) {
    try {tx.abort();} catch {}
    await done.catch(()=>{});
    throw error;
  }
}
function saveRecord(rows,id,data) {
  if(!id) {rows.unshift({...data,id:crypto.randomUUID()});return;}
  const index=rows.findIndex(item=>item.id===id);
  if(index<0) throw new Error("该记录已删除，请刷新查看。");
  rows[index]={...rows[index],...data};
}
function removeRecord(rows,id) {
  const index=rows.findIndex(item=>item.id===id);
  if(index<0) throw new Error("该记录已删除，请刷新查看。");
  rows.splice(index,1);
}
function validateNumber(value) {
  if(!Number.isInteger(value) || value<1 || value>600) throw new Error("请填写 1 到 600 分钟。");
  return value;
}
function checkedText(value) {
  const result=String(value ?? "").trim();
  if (!result) throw new Error("请填写必填内容。");
  return result;
}
function localSubmit(state,store,form) {
  if(role!=="student") throw new Error("只有学生可以提交训练。");
  const task=state.tasks.find(item=>item.id===form.get("id"));
  if (!task) throw new Error("找不到这项任务。");
  if ((task.status==="submitted") !== (form.get("mode")==="update")) throw new Error("任务状态已变化，请刷新。");
  const files=form.getAll("files").filter(item=>item instanceof File && item.size>0);
  const existing=state.attachments.filter(item=>item.taskId===task.id).length;
  if(files.length+existing>3 || files.some(item=>
    item.size>8*1024*1024 || !/^(image\/(jpeg|png|webp|gif|heic|heif)|application\/pdf|audio\/[a-z0-9.+-]+)$/i.test(item.type)
  )) throw new Error("最多保存 3 个图片、PDF 或音频，每个不超过 8 MB。");
  task.notes=checkedText(form.get("notes"));
  task.actualMinutes=validateNumber(Number(form.get("actualMinutes")));
  task.status="submitted";
  task.submittedAt=new Date().toISOString();
  for(const file of files) {
    const id=crypto.randomUUID();
    store.put(file,id);
    state.attachments.push({id,taskId:task.id,name:file.name,size:file.size,type:file.type});
  }
}
window.sprintOffline={
  changeRole(){role=role==="student"?"parent":"student";},
  async read() {
    const state=await withState();
    state.tasks.sort((a,b)=>a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    state.logs.sort((a,b)=>b.date.localeCompare(a.date));
    state.mistakes.sort((a,b)=>b.date.localeCompare(a.date));
    return {...state,role,today:beijingToday()};
  },
  async write(payload) {
    await withState((state,store)=>{
      if(payload instanceof FormData) {
        localSubmit(state,store,payload);
        if (initialSyncToken && syncRole!=="parent") {
          enqueueCompletion(state,completionEvent("task",state.tasks.find(task=>task.id===payload.get("id"))));
        }
        return;
      }
      const {action,id,data}=payload;
      if(action==="review") {
        if(role!=="parent") throw new Error("请从家长预览提交评价。");
        if(data.taskId && state.tasks.find(item=>item.id===data.taskId)?.status!=="submitted") throw new Error("任务尚未提交。");
        state.reviews.unshift({...data,comment:checkedText(data.comment),id:crypto.randomUUID(),author:"家长（本机）",createdAt:new Date().toISOString()});
        return;
      }
      if(role!=="student") throw new Error("只有学生可以修改学习记录。");
      switch(action) {
        case "task.save": saveRecord(state.tasks,id,{...(id?{}:{status:"planned"}),...data,title:checkedText(data.title)});break;
        case "task.remove": {
          if(state.tasks.find(item=>item.id===id)?.status!=="planned") throw new Error("只有待完成的任务可以删除。");
          removeRecord(state.tasks,id);break;
        }
        case "log.save": saveRecord(state.logs,id,{...data,content:checkedText(data.content)});break;
        case "log.remove": removeRecord(state.logs,id);break;
        case "mistake.save": saveRecord(state.mistakes,id,{...data,title:checkedText(data.title),cause:checkedText(data.cause),correction:checkedText(data.correction)});break;
        case "mistake.remove": removeRecord(state.mistakes,id);break;
        case "vocab.save": {
          if(data.date<firstDay || data.date>beijingToday()) throw new Error("请检查日期。");
          const entry={...data,minutes:validateNumber(data.minutes),completedAt:new Date().toISOString()};
          const old=state.vocabulary.findIndex(item=>item.date===data.date);
          if(old<0) state.vocabulary.unshift(entry);
          else state.vocabulary[old]={...state.vocabulary[old],...entry};
          if (initialSyncToken && syncRole!=="parent") enqueueCompletion(state,completionEvent("vocab",entry));
          break;
        }
        case "word.add": {
          const words=parseUnfamiliarWords(data.words);
          if(!words) throw new Error("请输入英文单词或短语，最多 60 条，用换行或逗号分开。");
          if(data.date<firstDay || data.date>beijingToday()) throw new Error("请检查日期。");
          for (const word of words) {
            const found=state.words.find(item=>item.key===word.key);
            if(found) {
              if(data.date>found.lastSeen) found.lastSeen=data.date;
              if(data.date<found.firstSeen) found.firstSeen=data.date;
              found.known=0;
            } else state.words.push({...word,firstSeen:data.date,lastSeen:data.date,attempts:0,note:"",known:0});
          }
          break;
        }
        case "word.note":
        case "word.test":
        case "word.remove": {
          const index=state.words.findIndex(item=>item.key===data.key);
          if(index<0) throw new Error("单词已删除，请刷新查看。");
          const word=state.words[index];
          if(action==="word.remove") state.words.splice(index,1);
          if(action==="word.note") word.note=data.note;
          if(action==="word.test") {
            word.attempts++;
            word.known=data.known?1:0;
            word.testedAt=new Date().toISOString();
          }
          break;
        }
        case "settings": Object.assign(state,data);break;
        default: throw new Error("未知操作。");
      }
    });
  },
  async download(id) {
    const db=await database();
    const file=await requestValue(db.transaction("evidence").objectStore("evidence").get(id));
    if(!file) throw new Error("找不到这份证据。");
    const url=URL.createObjectURL(file);
    const link=document.createElement("a");
    link.href=url;link.download=file.name;link.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },
};

async function refreshSync() {
  syncError=undefined;
  const date=syncDate;
  try {
    if (syncRole==="student") await syncClient.flush();
    const {entries}=await syncClient.day(date);
    if (syncDate===date) syncRecords=entries;
  } catch {
    syncError=syncRole==="student" ? "暂时无法同步。本机记录已保存，请稍后刷新重试。" : "暂时无法读取云端，请刷新重试。";
    if (syncDate===date) syncRecords=null;
  }
  await read();
  render();
}

async function connectSync() {
  if (!initialSyncToken || syncRole) return;
  try {
    syncClient=createSync(async data=>{
      const response=await fetch(cloudConfig.endpoint,{
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data),
        credentials:"omit", referrerPolicy:"no-referrer", cache:"no-store",
        signal:AbortSignal.timeout(12000),
      });
      return response.json();
    },initialSyncToken,withState);
    const connection=await syncClient.connect();
    syncRole=connection.role;
    syncDate=model.today;
    page="home";
    await refreshSync();
  } catch {
    syncError="暂时无法连接家庭同步，请检查链接并重试。";
    render();
  }
}

async function requestChange(payload) {
  const multipart=payload instanceof FormData;
  const res=await fetch("/api/sprint",{
    method:"POST",headers:multipart?{}:{"Content-Type":"application/json"},
    body:multipart?payload:JSON.stringify(payload),
  });
  const data=await res.json().catch(()=>({error:"连接中断，请稍后重试。"}));
  if(!res.ok) throw new Error(data.error || "保存失败。");
  return data;
}

async function write(payload) {
  if(window.sprintOffline) return window.sprintOffline.write(payload);
  if(!(payload instanceof FormData) || !model.directUploads) return requestChange(payload);
  const files=payload.getAll("files").filter(file=>file instanceof File && file.size>0);
  const taskId=payload.get("id");
  const updating=payload.get("mode")==="update";
  let uploads=[];
  if(files.length) {
    const intent=await requestChange({action:"evidence.prepare",data:{taskId,updating,
      files:files.map(({name,type,size})=>({name,type,size})),
    }});
    uploads=intent.uploads;
    await Promise.all(uploads.map(async ({url},i)=>{
      const result=await fetch(url,{method:"PUT",body:files[i],referrerPolicy:"no-referrer"});
      if(!result.ok) throw new Error("附件上传失败，请重试。");
    }));
  }
  return requestChange({action:"evidence.submit",data:{taskId,updating,uploadIds:uploads.map(item=>item.id),
    notes:payload.get("notes"),actualMinutes:Number(payload.get("actualMinutes")),
  }});
}

function openModal(title,content,{onSubmit,saveLabel="保存",secondary=""}={}) {
  if (dialog) dialog.close();
  opener = document.activeElement;
  const body = `<div class="modal-body">${content}${onSubmit ? '<p class="form-error" role="alert"></p>' : ""}</div><div class="modal-foot">${secondary}${button(onSubmit?"取消":"关闭","close")}${onSubmit ? `<button type="submit" class="button primary">${saveLabel}</button>` : ""}</div>`;
  modalRoot.innerHTML = `<dialog aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${esc(title)}</h2>${button("","close",{glyph:"close",variant:"plain icon-only",label:"关闭窗口"})}</header>${onSubmit ? `<form>${body}</form>` : body}</dialog>`;
  dialog = modalRoot.querySelector("dialog");
  const current = dialog;
  current.addEventListener("close", () => {
    if (dialog !== current) return;
    dialog = undefined; modalRoot.replaceChildren();
    if (opener?.isConnected) opener.focus();
  });
  if (onSubmit) current.querySelector("form").addEventListener("submit",async event=>{
    event.preventDefault();
    const form = event.currentTarget;
    const formError = form.querySelector(".form-error");
    formError.textContent = "";
    const submit = form.querySelector('[type="submit"]');
    if (submit.disabled) return;
    submit.disabled = true;
    try { await onSubmit(new FormData(form)); current.close(); await reloadAfterSave(); }
    catch(error) { formError.textContent = error.message; }
    finally { submit.disabled = false; }
  });
  current.showModal();
}

  openModal("考试日期设置",`
    ${field("潞河国际考试日期",dateInput("examDate",model.examDate))}
    <label class="check"><input type="checkbox" name="examConfirmed" ${model.examConfirmed?"checked":""}> 已收到学校确认</label>
    ${field("校内月考日期（可选）",dateInput("monthlyDate",model.monthlyDate??"",false))}
    <p class="hint">设置月考日期后，临近月考的周计划会提示减量。可以逐项改日期和时长。</p>
  `,{onSubmit:form=>save("settings",undefined,{examDate:form.get("examDate"),monthlyDate:form.get("monthlyDate")||null,examConfirmed:form.has("examConfirmed")})});
}
function share() {
  openModal("邀请家长",`<p>在 ChatGPT 网站页面的「分享」中，添加家长的 ChatGPT 登录邮箱为查看者，再把下面的链接发给家长。</p><p>家长用自己的账号登录后，可在网站里查看同步进度和附件，给任务评价或留言。</p>
    ${field("网站链接",`<input id="share-link" readonly value="${esc(location.origin+"/")}">`)}
    <div class="actions">${button("复制链接","copy-link",{glyph:"copy"})}</div>`);
}
function confirmRemove(kind,id) {
  openModal("确认删除","<p>删除后，这条记录将从学生和家长端一起移除。</p>",{
    saveLabel:"删除",onSubmit:()=>save(kind+".remove",id,null),
  });
}

async function handle(action,id) {
  switch(action) {
    case "navigate": if(sections[id]) {page=id;render();window.scrollTo(0,0);} break;
    case "week-change": monday=shift(monday,Number(id));render();break;
    case "week-current": monday=start(model.today);render();break;
    case "task-new": editTask(undefined,id||model.today);break;
    case "task-edit": editTask(taskBy(id),model.today);break;
    case "task-view": viewTask(taskBy(id));break;
    case "task-submit": submitTask(taskBy(id));break;
    case "task-remove": confirmRemove("task",id);break;
    case "vocab-open": vocabDate=id;page="vocab";render();window.scrollTo(0,0);break;
    case "vocab-check": vocabCheck(id);break;
    case "word-filter": vocabFilter=id;render();break;
    case "word-note": editWordNote(id);break;
    case "word-remove": openModal("删除单词","<p>将从复习词表移除此词和该词的自测状态。</p>",{saveLabel:"删除",onSubmit:()=>save("word.remove",undefined,{key:id})});break;
    case "test-start": {
      const words=(model.words??[]);
      const pending=words.filter(word=>!word.known);
      startWordsTest((pending.length?pending:words).map(word=>word.key));
      break;
    }
    case "test-reveal": if(testRound){testRound.revealed=true;render();}break;
    case "test-answer": {
      const round=testRound;
      if(!round?.revealed || round.pending) break;
      round.pending=true;
      try {
        const key=round.queue[round.index];
        const known=id==="yes";
        await save("word.test",undefined,{key,known});
        round.results.push({key,known});
        round.index++;
        round.revealed=false;
        await read();render();
      } finally {round.pending=false;}
      break;
    }
    case "test-retry": if(testRound) startWordsTest(testRound.results.filter(item=>!item.known).map(item=>item.key));break;
    case "test-end": testRound=undefined;render();break;

    case "log-new": editLog();break;
    case "log-edit": editLog(model.logs.find(item=>item.id===id));break;
    case "log-remove": confirmRemove("log",id);break;
    case "mistake-new": editMistake();break;
    case "mistake-edit": editMistake(model.mistakes.find(item=>item.id===id));break;
    case "mistake-remove": confirmRemove("mistake",id);break;
    case "mistake-filter": mistakeFilter=id;render();break;
    case "mistake-toggle": {
      const item=model.mistakes.find(row=>row.id===id);
      if(item){await save("mistake.save",id,{...item,mastered:!item.mastered});await reloadAfterSave();}
      break;
    }
    case "review-new": makeReview(id);break;
    case "settings": settings();break;
    case "family-role": {
      const res=await fetch("/access/mode",{method:"POST"});
      if(!res.ok) throw new Error("登录已过期，请刷新页面。");
      await read();render();break;
    }
    case "logout": {
      const res=await fetch("/access/logout",{method:"POST"});
      if(!res.ok) throw new Error("暂时无法退出，请刷新后再试。");
      location.assign("/");break;
    }
    case "local-role": window.sprintOffline.changeRole();await read();render();break;
    case "local-download": await window.sprintOffline.download(id);break;
    case "download-evidence": {
      const file=model.attachments.find(item=>item.id===id);
      if(!file) break;
      const result=await fetch("/api/evidence/"+encodeURIComponent(id),{referrerPolicy:"no-referrer"});
      if(!result.ok) throw new Error("暂时无法下载此附件。");
      const url=URL.createObjectURL(await result.blob());
      const link=document.createElement("a");
      link.href=url;
      link.download=file.name;
      link.click();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      break;
    }
    case "share": share();break;
    case "sync-connect": await connectSync();break;
    case "sync-refresh": await refreshSync();break;
    case "sync-import":
      if (syncRole==="student" && cloudConfig.allowImport) {
        openModal("同步本机历史", "<p>把这个浏览器里的已完成任务及单词打卡上传，家长可以按日查看。</p>", {
          saveLabel:"同步历史",
          onSubmit:async ()=>{
            await withState(state=>{
              for (const task of state.tasks.filter(actual)) enqueueCompletion(state,completionEvent("task",task));
              for (const checkIn of state.vocabulary) enqueueCompletion(state,completionEvent("vocab",checkIn));
              state.syncHistoryImported=true;
            });
          },
        });
      }
      break;
    case "copy-today": await copyTodayCompletion();break;
    case "copy-link": {
      const input=document.querySelector("#share-link");
      try { await navigator.clipboard.writeText(input.value);toast("已复制网站链接。"); }
      catch { input.focus();input.select();toast("已选中链接，可以手动复制。"); }
      break;
    }
    case "close": dialog?.close();break;
    case "refresh": await read();render();toast("本机进度已刷新。");break;
    case "retry": await boot();break;
  }
}

document.addEventListener("click",event=>{
  const element = event.target.closest("[data-do]");
  if(!element || element.disabled) return;
  if (["refresh","sync-connect","sync-refresh","mistake-toggle","test-answer"].includes(element.dataset.do)) element.disabled = true;
  handle(element.dataset.do,element.dataset.value).catch(error=>toast(error.message,true)).finally(()=>{element.disabled=false;});
});

document.addEventListener("change",event=>{
  if (event.target.id==="sync-date" && event.target.value && event.target.validity.valid) {
    syncDate=event.target.value;
    syncRecords=undefined;
    refreshSync().catch(error=>toast(error.message,true));
  }
  if(event.target.id==="vocab-date" && event.target.validity.valid && event.target.value) {vocabDate=event.target.value;render();}
});

document.addEventListener("submit",async event=>{
  if(event.target.id!=="add-words") return;
  event.preventDefault();
  const form=event.target;
  const submit=form.querySelector('[type="submit"]');
  const alert=form.querySelector(".form-error");
  if(submit.disabled) return;
  alert.textContent="";
  submit.disabled=true;
  try {
    const date=vocabDate ?? (model.today>model.examDate?model.examDate:model.today);
    await save("word.add",undefined,{date,words:new FormData(form).get("words")});
    vocabFilter="待复习";
    await reloadAfterSave();
  } catch(error) {alert.textContent=error.message;}
  finally {submit.disabled=false;}
});

async function boot() {
  try {await read();render();await connectSync();}
  catch(error) {
    root.innerHTML=`<div class="initial"><span class="brand-icon">${icon("rise")}</span><b>暂时无法打开冲刺站</b><p>${esc(error.message)}</p>${button("重试","retry",{variant:"primary",glyph:"refresh"})}</div>`;
  }
}
addEventListener("online",()=>{
  if (syncRole==="student") refreshSync().catch(error=>toast(error.message,true));
});
boot();

</script>

  <div id="sprint-app"><div class="initial"><span class="brand-icon">↗</span><p>正在打开冲刺站…</p></div></div>
  <div id="modal-root"></div>
  <div id="notifications" role="status" aria-live="polite"></div>
</body>
